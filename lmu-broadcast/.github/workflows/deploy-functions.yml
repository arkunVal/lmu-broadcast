# Laedt die Server-Funktion "api" (supabase/functions/api) zu Supabase hoch. Kostenlos.
# Einmalig: Repo > Settings > Secrets > Actions:
#   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens > Generate new token)
#   SUPABASE_PROJECT_REF   (Supabase > Project Settings > General > Reference ID)
name: Deploy Supabase Function
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy api --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
